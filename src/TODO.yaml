# Вопросы:
- ✅ Как подключить WebSocket и подписаться на сообщения? Для этого нужно будет переписывать IPC_handler? 
- Как реализовать сканер по ModBus? Возможно гляну старый ikm-controller (mvp).
- Итого сколько акторов у меня получится? 1 - Сканер, 2 - Чтение и выдача данных?



- SerialScanner отслеживает USB-Serial порты, подключает/отключает их, создавая/разрушая ModbusWorker.

- ModbusFabric управляет списком устройств и собирает данные от воркеров.

- ModbusWorker периодически опрашивает порт, отправляет WorkerReport.

- IpcHandler получает запросы от WebSocket IPC, обрабатывает подписки и отправляет данные подписчикам.

- main.rs соединяет всё вместе через ractor.